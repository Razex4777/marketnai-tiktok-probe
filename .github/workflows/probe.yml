name: tiktok-probe
on:
  workflow_dispatch:
    inputs:
      keyword:
        description: Search keyword
        default: gta 6
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx playwright install --with-deps chromium
      # Xvfb gives Chrome a real (virtual) display, so headed mode runs headed.
      - run: xvfb-run --auto-servernum -- node probe.mjs "${{ inputs.keyword }}"
